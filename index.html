<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Maze Pengembara Kelana + VR Bintang</title>
<style>
:root{--bg:#f4f1e8;--fg:#1f2a1f;--card:#fff;--acc:#2e6b3a}
@media(prefers-color-scheme:dark){:root{--bg:#12161a;--fg:#e9efe6;--card:#1c232a;--acc:#4fa865}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg)}
.w{max-width:460px;margin:0 auto;padding:10px}
h2{text-align:center;margin:6px 0 10px;font-size:20px}
button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px;font-size:15px;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45}
button:focus-visible,input:focus-visible{outline:3px solid #f5c542;outline-offset:2px}
.card{background:var(--card);border-radius:12px;padding:12px}
input{width:100%;padding:10px;font-size:16px;margin:4px 0 10px;border-radius:8px;border:1px solid #999;background:var(--bg);color:var(--fg)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.tabs button.on{background:#f2c230;color:#3a2a00;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
.st{position:relative;border-radius:12px;overflow:hidden;background:#000}
#cv{display:block;width:100%;aspect-ratio:8/5;image-rendering:pixelated}
#mm{position:absolute;top:6px;right:6px;width:22%;aspect-ratio:1;opacity:.85;border-radius:6px}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.8);color:#fff;display:none;flex-direction:column;justify-content:center;padding:12px;overflow:auto;z-index:5}
.ov.on{display:flex}
.ov p{margin:0 0 8px;font-weight:600}
.ov button{display:block;width:100%;text-align:left;margin-top:6px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:clamp(74px,22vw,96px);gap:10px;max-width:380px;margin:14px auto 0;user-select:none;-webkit-user-select:none}
.pad button{font-size:clamp(34px,10vw,46px);line-height:1;background:#f2c230;color:#3a2a00;border-radius:16px;box-shadow:0 4px 0 #b98f12;padding:0}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #b98f12}
.hd{text-align:center}
#hdLogo{display:block;margin:4px auto 0;height:74px;max-width:85%;object-fit:contain;border-radius:10px;background:#fff;padding:2px 8px}
#mu{padding:2px 12px;font-size:18px;line-height:1.3}
.msg{background:var(--card);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
#arBox{position:relative;width:100%;aspect-ratio:3/4;max-height:70vh}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0b1630}
#arCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hide{display:none!important}
</style>
</head>
<body>
<div class="w">
<div class="hd"><img id="hdLogo" alt="Logo PLNJ Pengakap Johor"><h2>🧭 Pengembara Kelana: Maze + VR Bintang</h2></div>

<div class="card" id="login">
  <label>Nama<input id="nama" autocomplete="off" maxlength="40"></label>
  <label>Kod Krew<input id="krew" autocomplete="off" maxlength="20"></label>
  <button type="button" id="mula" style="width:100%">Mula Main ▶</button>
  <div id="err" style="color:#c33;font-size:14px;margin-top:6px" aria-live="polite"></div>
</div>

<div id="game" class="hide">
  <div class="tabs">
    <button type="button" id="tMaze" class="on">🧭 Maze</button>
    <button type="button" id="tAR">📷 VR Bintang</button>
  </div>
  <div class="top"><span id="sc">Markah 0/100</span><button type="button" id="mu" aria-label="Hidup/matikan muzik">🔊</button><span id="cnt">⭐ 0/10</span></div>

  <!-- MOD MAZE -->
  <div id="vMaze">
    <div class="st">
      <canvas id="cv" width="320" height="200" aria-label="Pandangan 3D maze"></canvas>
      <canvas id="mm" width="130" height="130" aria-hidden="true"></canvas>
    </div>
    <div class="pad" id="pad">
      <span></span><button type="button" data-k="f" aria-label="Depan">▲</button><span></span>
      <button type="button" data-k="l" aria-label="Pusing kiri">◀</button><button type="button" data-k="b" aria-label="Belakang">▼</button><button type="button" data-k="r" aria-label="Pusing kanan">▶</button>
    </div>
  </div>

  <!-- MOD VR -->
  <div id="vAR" class="hide">
    <div class="st" id="arBox">
      <video id="vid" playsinline muted autoplay></video>
      <canvas id="arCv" aria-label="Paparan VR bintang"></canvas>
    </div>
    <button type="button" id="tangkap" style="width:100%;margin-top:8px;background:#f2c230;color:#3a2a00;font-weight:700" disabled>🎯 Tangkap Bintang</button>
  </div>

  <div class="msg" id="msg" aria-live="polite">Tekan dan tahan butang kuning untuk berjalan. Cari ⭐ yang terapung!</div>
  <button type="button" id="rs" style="width:100%;margin-top:8px">Mula Semula</button>
  <div class="ov" id="ov" aria-live="polite"></div>
</div>
</div>

const SIMG=SIMG_SRC.map(s=>{const im=new Image();im.src=s;return im});

const $=id=>document.getElementById(id),msg=$('msg'),ov=$('ov');
let pem={},score=0,doneM=new Set(),doneA=new Set(),busy=false,mode='maze';

function hud(){$('sc').textContent='Markah '+score+'/100';$('cnt').textContent='⭐ '+(doneM.size+doneA.size)+'/10'}
function send(mod,cp,ok){
  const end=doneM.size+doneA.size===10;
  if(!SHEET_URL)return;
  fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({nama:pem.nama,krew:pem.krew,mod:mod,cp:cp,betul:ok,xp:score,tamat:end})}).catch(()=>{});
}
function ask(label,q,onOK,mod,cp){
  busy=true;keys={};const [t,o,ans]=q;ov.innerHTML='';
  const p=document.createElement('p');p.textContent=label+': '+t;ov.appendChild(p);
  o.forEach((op,k)=>{const b=document.createElement('button');b.type='button';b.textContent=op;
    b.addEventListener('click',()=>{
      if(k===ans){score+=10;onOK();hud();send(mod,cp,true);ov.classList.remove('on');busy=false;
        msg.textContent=(doneM.size+doneA.size===10)?'🏅 Tahniah '+pem.nama+'! Lencana Pengembara Bintang — '+score+'/100!':'✅ Betul! +10 markah.';
        if(mode==='maze')draw(0);}
      else{score=Math.max(0,score-2);hud();send(mod,cp,false);b.disabled=true;b.textContent='❌ '+op+' (−2, cuba lagi)'}
    });ov.appendChild(b)});
  ov.classList.add('on');ov.querySelector('button').focus();
}

const cv=$('cv'),x=cv.getContext('2d'),mx=$('mm').getContext('2d'),W=320,H=200,zb=new Float32Array(W);
let px,py,a,cps,keys={},loop=0;
function initMaze(){cps=[];G.forEach((r,y)=>[...r].forEach((c,i)=>{if(c==='P'){px=i+.5;py=y+.5}if(c==='C')cps.push({x:i+.5,y:y+.5,q:QM[cps.length]})}));a=0;draw(0)}

let muted=false;
function playMusic(){if(muted)return;const pr=bgm.play();if(pr&&pr.catch)pr.catch(()=>{})}
function updMu(){$('mu').textContent=muted?'🔇':'🔊'}
$('mu').addEventListener('click',()=>{muted=!muted;updMu();if(muted)bgm.pause();else playMusic()});
playMusic();
['pointerdown','keydown','touchend'].forEach(ev=>document.addEventListener(ev,()=>{if(bgm.paused)playMusic()},{passive:true}));

/* ================= NAVIGASI ================= */
function setMode(m){
  mode=m;keys={};$('tMaze').classList.toggle('on',m==='maze');$('tAR').classList.toggle('on',m==='ar');
  $('vMaze').classList.toggle('hide',m!=='maze');$('vAR').classList.toggle('hide',m!=='ar');
  if(m==='ar'){startAR()}else{stopAR();msg.textContent='Tekan dan tahan butang kuning untuk berjalan. Cari ⭐ yang terapung!';draw(0)}
}
$('tMaze').addEventListener('click',()=>setMode('maze'));
$('tAR').addEventListener('click',()=>setMode('ar'));
$('mula').addEventListener('click',()=>{
  const n=$('nama').value.trim(),k=$('krew').value.trim();
  if(!n||!k){$('err').textContent='Sila isi nama dan kod krew.';return}
  pem={nama:n,krew:k};$('login').classList.add('hide');$('game').classList.remove('hide');initMaze();hud();playMusic();
});
$('rs').addEventListener('click',()=>{if(!confirm('Mula semula? Markah akan kosong.'))return;score=0;doneM=new Set();doneA=new Set();busy=false;ov.classList.remove('on');initMaze();hud();setMode('maze')});
</script>
